<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Talon</title>
  </head>
  <body>
    <div id="app">
      <div id="toolbar">
        <button id="new-file" title="New File (Ctrl+N)">New</button>
        <button id="open-file" title="Open File (Ctrl+O)">Open</button>
        <button id="save-file" title="Save (Ctrl+S)">Save</button>
        <button id="save-as-file" title="Save As (Ctrl+Shift+S)">Save As</button>
        <button id="toggle-preview" title="Toggle Preview (Ctrl+P)">Toggle Preview</button>
        <button id="recent-files" title="Recent Files">Recent</button>
        <button id="ai-rewrite" title="AI Rewrite (Ctrl+J / ⌘J)">AI Rewrite</button>
        <button id="settings" title="Settings (Ctrl+, / ⌘,)">Settings</button>
        <span id="status"></span>
      </div>
      
      <div id="main-container">
        <div id="editor-container">
          <div id="editor"></div>
        </div>
        <div id="preview-container" style="display: none;">
          <div id="preview"></div>
        </div>
      </div>

      <div id="ai-panel" style="display: none;">
        <div id="ai-header">
          <span id="ai-scope-chip" style="display: none;"></span>
          <span id="ai-action-label">Rewrite</span>
        </div>
        <div id="ai-content"></div>
        <div id="ai-controls">
          <button id="ai-apply" title="Apply (Enter)">Apply</button>
          <button id="ai-dismiss" title="Dismiss (Esc)">Dismiss</button>
          <div id="ai-more-container">
            <button id="ai-more" title="More Actions">More ▾</button>
            <div id="ai-more-menu" style="display: none;">
              <button data-action="shorten">Shorten</button>
              <button data-action="outline">Outline</button>
              <button data-action="extract-decisions">Extract → ## Decisions</button>
            </div>
          </div>
        </div>
      </div>

      <div id="modal-backdrop" style="display: none;">
        <div id="settings-modal" class="modal">
          <h2>Settings</h2>
          <label>
            OpenAI API Key:
            <input type="password" id="api-key-input" placeholder="sk-..." />
          </label>
          <label>
            Autosave Interval (seconds):
            <input type="number" id="autosave-interval" value="30" min="5" />
          </label>
          <div class="modal-buttons">
            <button id="save-settings">Save</button>
            <button id="cancel-settings">Cancel</button>
          </div>
        </div>

        <div id="recent-modal" class="modal">
          <h2>Recent Files</h2>
          <div id="recent-list"></div>
          <div class="modal-buttons">
            <button id="close-recent">Close</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
